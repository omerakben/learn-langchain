<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="A complete standalone LangChain, LangGraph, LangSmith, RAG, MCP, and production agent engineering learning hub.">
    <title>LangChain Learning Hub</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="app-shell" data-app-shell>
      <aside class="sidebar" id="sidebar" aria-label="Learning hub navigation">
        <div class="brand-block">
          <a class="brand-mark" href="#ecosystem-map" aria-label="LangChain Learning Hub home">
            <span class="brand-symbol" aria-hidden="true">LC</span>
            <span>
              <span class="brand-title">LangChain Learning Hub</span>
              <span class="brand-subtitle">Agent engineering atlas</span>
            </span>
          </a>
        </div>

        <div class="sidebar-stats" id="sidebar-stats" aria-live="polite"></div>
        <nav class="nav-list" id="nav-list"></nav>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="icon-button mobile-menu" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">
            <span aria-hidden="true">☰</span>
            <span class="sr-only">Toggle navigation</span>
          </button>

          <button class="search-trigger" id="search-trigger" type="button" aria-haspopup="dialog">
            <span aria-hidden="true">⌕</span>
            <span>Search everything</span>
            <kbd>/</kbd>
          </button>

          <div class="topbar-actions">
            <button class="icon-button" id="bookmark-current" type="button" title="Bookmark current section">
              <span aria-hidden="true">☆</span>
              <span class="sr-only">Bookmark current section</span>
            </button>
            <button class="icon-button" id="theme-toggle" type="button" title="Toggle dark and light mode">
              <span aria-hidden="true">◐</span>
              <span class="sr-only">Toggle theme</span>
            </button>
            <button class="icon-button" id="shortcuts-trigger" type="button" aria-haspopup="dialog" title="Keyboard shortcuts">
              <span aria-hidden="true">?</span>
              <span class="sr-only">Keyboard shortcuts</span>
            </button>
          </div>
        </header>

        <main id="main-content" class="content" tabindex="-1">
          <noscript>
            <section class="noscript-card">
              <h1>JavaScript is required</h1>
              <p>This standalone learning hub stores the curriculum, search index, diagrams, progress, bookmarks, and quizzes in <code>app.js</code>.</p>
            </section>
          </noscript>
          <div id="app" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <div class="overlay" id="overlay" hidden></div>

    <section class="dialog" id="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Global index</p>
          <h2 id="search-title">Search the hub</h2>
        </div>
        <button class="icon-button" id="search-close" type="button">
          <span aria-hidden="true">×</span>
          <span class="sr-only">Close search</span>
        </button>
      </div>
      <label class="search-box">
        <span class="sr-only">Search query</span>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Try 'checkpointing', 'MCP tools', 'RAG poisoning', or 'LangSmith evals'">
      </label>
      <div class="search-filters" id="search-filters" aria-label="Search filters"></div>
      <div class="search-results" id="search-results" tabindex="0"></div>
    </section>

    <section class="dialog compact-dialog" id="shortcuts-dialog" role="dialog" aria-modal="true" aria-labelledby="shortcuts-title" hidden>
      <div class="dialog-header">
        <div>
          <p class="eyebrow">Navigation</p>
          <h2 id="shortcuts-title">Keyboard shortcuts</h2>
        </div>
        <button class="icon-button" id="shortcuts-close" type="button">
          <span aria-hidden="true">×</span>
          <span class="sr-only">Close shortcuts</span>
        </button>
      </div>
      <dl class="shortcut-list">
        <div><dt><kbd>/</kbd></dt><dd>Open search</dd></div>
        <div><dt><kbd>t</kbd></dt><dd>Toggle theme</dd></div>
        <div><dt><kbd>b</kbd></dt><dd>Bookmark current section</dd></div>
        <div><dt><kbd>j</kbd></dt><dd>Go to next section</dd></div>
        <div><dt><kbd>k</kbd></dt><dd>Go to previous section</dd></div>
        <div><dt><kbd>?</kbd></dt><dd>Show this panel</dd></div>
        <div><dt><kbd>Esc</kbd></dt><dd>Close overlays</dd></div>
      </dl>
    </section>

    <script src="app.js"></script>
  </body>
</html>
